server {
    listen 43217;
    listen [::]:43217;
    server_name _;

    root /var/www/holding-architecture;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/static/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
